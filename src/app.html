		/>
		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- Open Graph / Discord / Telegram -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://alik532ua.github.io/islands-of-nonsense/" />
		<meta property="og:title" content="Islands of Nonsense — Castle Fight Web" />
		<meta
			property="og:description"
			content="Тактичний авто-батлер за мотивами Warcraft III Castle Fight: будівництво баз, 300+ юнітів стінка на стінку, Boids-фізика, онлайн-мультиплеєр 1v1 та 2v2."
		/>
		<meta
			property="og:image"
			content="https://alik532ua.github.io/islands-of-nonsense/assets/castles/east_castle_stage_0.webp"
		/>
		<meta property="og:locale" content="uk_UA" />
		<meta property="og:locale:alternate" content="en_US" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Islands of Nonsense — Castle Fight Web" />
		<meta
			name="twitter:description"
			content="Тактичний авто-батлер за мотивами Warcraft III Castle Fight: будівництво баз та штурм ворожого замку."
		/>

			name="twitter:image"
			content="https://alik532ua.github.io/islands-of-nonsense/assets/castles/east_castle_stage_0.webp"
		/>
		<style>
			html.no-fullscreen .fullscreen-btn {
				display: none;
			}
		</style>
		<script>
			(function () {
				try {
					var can = document.fullscreenEnabled || document.webkitFullscreenEnabled;
					var standalone =
						navigator.standalone === true ||
						window.matchMedia('(display-mode: standalone)').matches === true;
					if (!can && standalone) document.documentElement.classList.add('no-fullscreen');
				} catch (e) {}
				try {
					window.addEventListener('beforeinstallprompt', function (event) {
						event.preventDefault();
						window.__pwaInstallPrompt = event;
					});
					window.addEventListener('appinstalled', function () {
						window.__pwaInstallPrompt = null;
					});
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
