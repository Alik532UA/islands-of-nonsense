name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Check translation key parity
        if: ${{ !cancelled() }}
        run: npm run check:i18n

      - name: Check test runner discovery
        if: ${{ !cancelled() }}
        run: npm run check:tests

      - name: Check Firebase RTDB rules & stamp
        if: ${{ !cancelled() }}
        run: npm run check:rules

      - name: Check types & code
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Lint formatting and code
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build static site
        id: build
        env:
          BUDGET_SOFT: '1'
        run: |
          npm run build
          npm run check:build
          npm run check:bundle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload artifact
        if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 15
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Checkout rules config
        if: ${{ env.HAS_FIREBASE_SA == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js for Firebase CLI
        if: ${{ env.HAS_FIREBASE_SA == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy Firebase RTDB rules
        if: ${{ env.HAS_FIREBASE_SA == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/firebase-sa.json"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_PATH"
          GOOGLE_APPLICATION_CREDENTIALS="$KEY_PATH" npx --yes --engine-strict=false firebase-tools@15.37.0 deploy --only database --project islands-of-nonsense --non-interactive

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
